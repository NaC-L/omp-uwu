  <title id="title">omp-uwu — Your coding agent, but it says "hewwo" (◕ᴗ◕✿)</title>
  <desc id="desc">A soft pink omp-uwu title on dark plum, with an original dithered pixel cat and tiny hearts. Kawaii chat for omp.</desc>
